name: BrykaOBD CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests (shared)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :shared:jvmTest

  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore stable debug keystore
        if: env.ANDROID_DEBUG_KEYSTORE_B64 != ''
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/brykaobd-debug.keystore"
          echo "ANDROID_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/brykaobd-debug.keystore" >> "$GITHUB_ENV"
      - name: Build Android debug APK
        env:
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :androidApp:assembleDebug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v5
        with:
          name: brykaobd-android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
